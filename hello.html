<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #697386;
      --paper: #f7f4ee;
      --line: rgba(24, 33, 47, 0.12);
      --accent: #2f7d73;
      --accent-soft: #d8ebe6;
      --glow: rgba(47, 125, 115, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, var(--accent-soft), transparent 34rem),
        linear-gradient(135deg, #fffdf8 0%, var(--paper) 54%, #eef4f2 100%);
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 70px rgba(24, 33, 47, 0.10);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 8px var(--glow);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 11vw, 6.5rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    p {
      max-width: 34rem;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.7;
    }

    .signature {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 38px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.95rem;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      color: #ffffff;
      background: var(--accent);
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(47, 125, 115, 0.22);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">First page</p>
    <h1>Hello,<br>world.</h1>
    <p>A quiet little HTML file with a soft background, crisp type, and just enough polish to make the classic greeting feel new again.</p>
    <div class="signature">
      <div class="mark">H</div>
      <span>Made in this folder, ready to open in your browser.</span>
    </div>
  </main>
</body>
</html>
